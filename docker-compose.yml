---

services:
  app:
    image: ghcr.io/klynn7/lubelogger_mcp:edge
    environment:
      # Required: base URL of your LubeLogger instance
      - LUBELOG_INSTANCE=https://lubelogger.example.com
      # Optional: set to true to expose the delete tools (also needs a Manager API key)
      # - LUBELOG_ENABLE_DELETE=false
    restart: unless-stopped
    # expose port and/or use serving via traefik
    ports:
      - 40150:8080
